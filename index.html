<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yakın-İş | VIP Hizmet Portalı</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 15px; }
    header { text-align: center; margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1 { color: #1a202c; font-size: 24px; }
    
    .cta-banner {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #fff; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px;
      font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .cta-btn {
      background: #fff; color: #128c7e; border: none; padding: 8px 16px; border-radius: 20px;
      font-weight: bold; text-decoration: none; cursor: pointer; display: inline-block;
    }

    .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    
    .card {
      background: #fff; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03); position: relative; display: flex; flex-direction: column; gap: 8px;
    }

    .vip-card {
      border: 2px solid #ffd700 !important;
      background: linear-gradient(135deg, #fffdf0 0%, #ffffff 100%);
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.25);
    }
    .vip-badge {
      position: absolute; top: -10px; right: 15px; background: #ffd700; color: #000;
      font-weight: bold; font-size: 11px; padding: 3px 10px; border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .card h3 { font-size: 18px; color: #2d3748; padding-right: 60px; }
    .card .category { font-size: 13px; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .phone { font-size: 15px; color: #2b6cb0; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>Yakın-İş Hizmet Rehberi</h1>
  </header>

  <div class="cta-banner">
    <span>🌟 Hizmetinizi öne çıkarmak mı istiyorsunuz?</span>
    <a href="https://wa.me/905522852592?text=Merhaba,%20yakinis.com%20sitenize%20VIP%20ilan%20vermek%20istiyorum." target="_blank" class="cta-btn">WhatsApp İlan Ver / VIP Al</a>
  </div>

  <div id="services" class="services-grid">
    <p style="text-align:center; grid-column: 1/-1;">Hizmetler yükleniyor...</p>
  </div>

  <script>
    // URL ve Key birebir aynı proje ID'sine (nbwvmhwpvsmyaijwdgag) esitlendi
    const SUPABASE_URL = 'https://nbwvmhwpvsmyaijwdgag.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5id3ZtaHdwdnNteWFpandkZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3OTc0MjQsImV4cCI6MjEwNjM3MzQyNH0.DpwGLlF9MM4_F184bKlqvrGsU8MNSg-VPwKBmzL3xbc';

    async function loadServices() {
      const container = document.getElementById('services');
      
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/services?select=*`, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Hatası: ${response.status}`);
        }

        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Henüz kayıtlı hizmet bulunmamaktadır.</p>';
          return;
        }

        data.sort((a, b) => (b.is_vip === true ? 1 : 0) - (a.is_vip === true ? 1 : 0));
        const now = new Date();

        container.innerHTML = data.map(item => {
          let isVipActive = item.is_vip;
          if (item.vip_until && new Date(item.vip_until) < now) {
            isVipActive = false;
          }

          return `
            <div class="card ${isVipActive ? 'vip-card' : ''}">
              ${isVipActive ? '<span class="vip-badge">⭐ VIP İLAN</span>' : ''}
              <h3>${item.title || 'Başlıksız Hizmet'}</h3>
              <span class="category">${item.category || 'Genel'}</span>
              <a href="tel:${item.phone}" class="phone">📞 ${item.phone || 'Telefon Yok'}</a>
            </div>
          `;
        }).join('');

      } catch (error) {
        console.error("Bağlantı Hatası:", error);
        container.innerHTML = `<p style="color:red; text-align:center; grid-column: 1/-1;">Bağlantı Hatası: ${error.message || error}</p>`;
      }
    }

    loadServices();
  </script>
</body>
  </html>
