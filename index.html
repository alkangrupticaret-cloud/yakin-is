<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakın-İş | Hizmet & VIP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">

    <!-- Üst Menü -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-black text-emerald-600 tracking-tight">Yakın-İş</h1>
            <div id="user-menu-area">
                <button onclick="openAuthModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2 rounded-xl transition">Giriş Yap</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">
        
        <!-- Üst Başlık ve Sekmeler -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
            <h2 class="text-xl font-bold text-slate-900 mb-1">Yakın-İş Hizmet & VIP Portal</h2>
            <p class="text-xs text-slate-500 mb-4">Ustaları keşfet ya da anında talep oluştur.</p>
            
            <div class="grid grid-cols-2 gap-2">
                <button onclick="switchTab('masters')" id="btn-tab-masters" class="bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">Ustalar</button>
                <button onclick="switchTab('request')" id="btn-tab-request" class="bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-xl text-sm transition">Talep Bırak</button>
            </div>
        </div>

        <!-- SEKME 1: USTA LİSTESİ -->
        <div id="tab-masters" class="space-y-3">
            <div class="flex gap-2">
                <input type="text" id="search-location" placeholder="Şehir / İlçe Arayın..." class="w-1/2 px-3 py-2.5 text-sm bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <select id="filter-category" onchange="loadMasters()" class="w-1/2 px-3 py-2.5 text-sm bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">Tüm Kategoriler</option>
                    <option value="Tesisat">Tesisat</option>
                    <option value="Elektrik">Elektrik</option>
                    <option value="Otomotiv">Otomotiv</option>
                </select>
            </div>

            <div id="masters-container" class="space-y-3">
                <div class="bg-white p-4 rounded-2xl border border-slate-100 text-center text-slate-400 text-sm">Ustalar yükleniyor...</div>
            </div>
        </div>

        <!-- SEKME 2: TALEP BIRAK -->
        <div id="tab-request" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hidden space-y-3">
            <h3 class="font-bold text-slate-900 text-base">Hizmet Talebi Oluştur (9.99 TL)</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
                <select id="req_category" class="w-full px-3 py-2.5 text-sm bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="Tesisat">Su Tesisatçısı</option>
                    <option value="Elektrik">Elektrikçi</option>
                    <option value="Otomotiv">Oto Tamir / Servis</option>
                    <option value="Nakliye">Nakliyat</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Talep Başlığı</label>
                <input type="text" id="req_title" placeholder="Örn: Mutfak gideri tıkanıklığı" class="w-full px-3 py-2.5 text-sm bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Açıklama</label>
                <textarea id="req_desc" rows="3" placeholder="Sorununuzu detaylıca yazın..." class="w-full px-3 py-2.5 text-sm bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">İl / İlçe</label>
                <input type="text" id="req_location" placeholder="Örn: Ankara / Çankaya" class="w-full px-3 py-2.5 text-sm bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button onclick="createRequest()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20">
                Talebi Yayınla ve Öde (9.99 TL)
            </button>
        </div>

    </main>

    <!-- GİRİŞ / KAYIT MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm p-6 rounded-3xl shadow-xl space-y-4 relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 text-center">Giriş Yap</h3>
            
            <div id="modal-name-box" class="hidden">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Ad Soyad</label>
                <input type="text" id="auth_name" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">E-posta</label>
                <input type="email" id="auth_email" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Şifre</label>
                <input type="password" id="auth_password" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div id="modal-type-box" class="hidden">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Üyelik Tipi</label>
                <select id="auth_type" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="client">Müşteri (Hizmet Almak İstiyorum)</option>
                    <option value="master">Usta (Hizmet Vermek İstiyorum)</option>
                </select>
            </div>

            <button onclick="handleAuthSubmit()" id="modal-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Giriş Yap</button>
            <div onclick="toggleAuthMode()" class="text-center text-xs text-emerald-600 font-semibold cursor-pointer">Hesabın yok mu? Kayıt ol</div>
        </div>
    </div>

    <script>
        // Kendi Supabase Proje Bilgilerinizi Buraya Yapıştırın:
        const SUPABASE_URL = 'BURAYA_PROJE_URL_ADRESINI_YAZ';
        const SUPABASE_ANON_KEY = 'BURAYA_ANON_KEY_YAZ';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegisterMode = false;
        let currentUser = null;

        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            const area = document.getElementById('user-menu-area');
            if (session) {
                currentUser = session.user;
                area.innerHTML = `<span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-xl">Oturum Açık</span>`;
            } else {
                currentUser = null;
                area.innerHTML = `<button onclick="openAuthModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2 rounded-xl transition">Giriş Yap</button>`;
            }
        }

        function switchTab(tab) {
            const btnMasters = document.getElementById('btn-tab-masters');
            const btnRequest = document.getElementById('btn-tab-request');
            const divMasters = document.getElementById('tab-masters');
            const divRequest = document.getElementById('tab-request');

            if (tab === 'masters') {
                btnMasters.className = "bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm";
                btnRequest.className = "bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-xl text-sm transition";
                divMasters.classList.remove('hidden');
                divRequest.classList.add('hidden');
                loadMasters();
            } else {
                btnRequest.className = "bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm";
                btnMasters.className = "bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-xl text-sm transition";
                divRequest.classList.remove('hidden');
                divMasters.classList.add('hidden');
            }
        }

        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
        
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('modal-title').innerText = isRegisterMode ? "Kayıt Ol" : "Giriş Yap";
            document.getElementById('modal-submit-btn').innerText = isRegisterMode ? "Kayıt Ol" : "Giriş Yap";
            document.getElementById('modal-name-box').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('modal-type-box').classList.toggle('hidden', !isRegisterMode);
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('auth_email').value;
            const password = document.getElementById('auth_password').value;

            if (isRegisterMode) {
                const fullName = document.getElementById('auth_name').value;
                const userType = document.getElementById('auth_type').value;
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) { alert("Kayıt hatası: " + error.message); return; }
                if (data.user) {
                    await supabase.from('profiles').insert([{ id: data.user.id, full_name: fullName, phone: '05000000000', user_type: userType }]);
                }
                alert("Kayıt başarılı! Giriş yapabilirsiniz.");
                toggleAuthMode();
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) { alert("Giriş hatası: " + error.message); return; }
                alert("Giriş başarılı!");
                closeAuthModal();
                checkUserSession();
            }
        }

        async function loadMasters() {
            const container = document.getElementById('masters-container');
            const categoryFilter = document.getElementById('filter-category').value;

            let query = supabase.from('master_details').select(`*, profiles(full_name, phone)`);
            if (categoryFilter) query = query.eq('category', categoryFilter);

            const { data: masters, error } = await query;

            if (error || !masters || masters.length === 0) {
                container.innerHTML = `<div class="bg-white p-4 rounded-2xl border border-slate-100 text-center text-slate-400 text-sm">Henüz kayıtlı usta bulunmuyor.</div>`;
                return;
            }

            container.innerHTML = "";
            masters.forEach(m => {
                const name = m.profiles ? m.profiles.full_name : "Usta";
                const phone = m.profiles ? m.profiles.phone : "";
                const isVip = m.is_vip;

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border ${isVip ? 'border-amber-300 ring-2 ring-amber-100' : 'border-slate-100'} flex justify-between items-center">
                        <div>
                            <div class="flex items-center space-x-2">
                                <h4 class="font-bold text-slate-900 text-sm">${name}</h4>
                                ${isVip ? '<span class="text-[10px] bg-amber-100 text-amber-700 font-bold px-2 py-0.5 rounded-full">★ VIP USTA</span>' : ''}
                            </div>
                            <p class="text-xs text-slate-500 mt-0.5">${m.category}</p>
                        </div>
                        <div class="flex space-x-2">
                            <a href="tel:${phone}" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl text-xs font-bold transition">📞 Arayın</a>
                            <a href="https://wa.me/${phone}?text=Merhaba,%20hizmet%20talebiniz%20için%20ulaşıyorum." target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-xl text-xs font-bold transition">💬 WhatsApp</a>
                        </div>
                    </div>
                `;
            });
        }

        async function createRequest() {
            if (!currentUser) {
                alert("Talep oluşturmak için lütfen önce giriş yapın!");
                openAuthModal();
                return;
            }

            const category = document.getElementById('req_category').value;
            const title = document.getElementById('req_title').value;
            const description = document.getElementById('req_desc').value;
            const locationVal = document.getElementById('req_location').value.split('/');
            const city = locationVal[0] ? locationVal[0].trim() : "Bursa";
            const district = locationVal[1] ? locationVal[1].trim() : "Merkez";

            if (!title || !description) { alert("Lütfen başlık ve açıklamayı doldurun."); return; }

            const onay = confirm("Talep yayınlamak için 9.99 TL tahsil edilecektir. Onaylıyor musunuz?");
            if (!onay) return;

            const { error } = await supabase.from('requests').insert([
                { client_id: currentUser.id, category, title, description, city, district, status: 'active', is_paid: true }
            ]);

            if (error) {
                alert("Talep oluşturulamadı: " + error.message);
            } else {
                alert("Ödeme başarılı! Talebiniz yayına alındı.");
                switchTab('masters');
            }
        }

        window.onload = () => {
            checkUserSession();
            loadMasters();
        };
    </script>
</body>
</html>
