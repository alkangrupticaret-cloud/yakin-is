<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakın-İş | Yerel Hizmet ve Usta Platformu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Üst Menü / Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight">Yakın-İş</h1>
            <div id="auth-status" class="text-sm font-medium text-slate-600">Giriş Yapılmadı</div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- MÜŞTERİ BÖLÜMÜ: TALEP OLUŞTURMA -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center space-x-3 mb-6">
                <div class="bg-blue-100 p-3 rounded-xl text-blue-600 font-bold">🛠️</div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Hizmet Talebi Oluştur</h2>
                    <p class="text-sm text-slate-500">İhtiyacını yaz, ustalardan teklif al (9.99 TL)</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kategori</label>
                    <select id="req_category" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Tesisatçı">Su Tesisatçısı</option>
                        <option value="Elektrikçi">Elektrikçi</option>
                        <option value="Oto Tamir">Oto Tamir / Servis</option>
                        <option value="Nakliye">Nakliyat</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Talep Başlığı</label>
                    <input type="text" id="req_title" placeholder="Örn: Mutfak gideri tıkanıklığı" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Açıklama</label>
                    <textarea id="req_desc" rows="3" placeholder="Sorununuzu detaylıca açıklayın..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">İl / İlçe</label>
                    <input type="text" id="req_location" placeholder="Örn: Ankara / Çankaya" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button onclick="createRequestWithPayment()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/25">
                    Ödeme Yap ve Talebi Yayınla (9.99 TL)
                </button>
            </div>
        </section>

        <!-- USTA BÖLÜMÜ: AÇIK TALEPLER -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center space-x-3 mb-6">
                <div class="bg-amber-100 p-3 rounded-xl text-amber-600 font-bold">📋</div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Açık Talepler</h2>
                    <p class="text-sm text-slate-500">Bölgendeki işleri incele, teklif ver (24.99 TL)</p>
                </div>
            </div>

            <div id="requests-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-1">
                <div class="text-center py-8 text-slate-400">Talepler yükleniyor...</div>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'SUPABASE_PROJE_URL_BURAYA';
        const SUPABASE_ANON_KEY = 'SUPABASE_ANON_KEY_BURAYA';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Kullanıcı oturum kontrolü
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            const statusEl = document.getElementById('auth-status');
            if (user) {
                statusEl.innerHTML = `<span class="text-green-600 font-semibold">● Aktif Oturum</span>`;
            } else {
                statusEl.innerHTML = `<span class="text-amber-600 font-semibold">Giriş Yapılmadı</span>`;
            }
        }

        // 1. Talep Oluşturma
        async function createRequestWithPayment() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                alert("Lütfen önce giriş yapın!");
                return;
            }

            const category = document.getElementById('req_category').value;
            const title = document.getElementById('req_title').value;
            const description = document.getElementById('req_desc').value;
            const locationParts = document.getElementById('req_location').value.split('/');
            const city = locationParts[0] ? locationParts[0].trim() : "Bilinmiyor";
            const district = locationParts[1] ? locationParts[1].trim() : "Bilinmiyor";

            if (!title || !description) {
                alert("Lütfen tüm alanları doldurun.");
                return;
            }

            const onay = confirm("Talep yayınlamak için 9.99 TL ödeme alınacaktır. Onaylıyor musunuz?");
            if (!onay) return;

            const { error } = await supabase.from('requests').insert([
                { client_id: user.id, category, title, description, city, district, status: 'active', is_paid: true }
            ]);

            if (error) {
                alert("Talep oluşturulamadı: " + error.message);
            } else {
                alert("Ödeme başarılı! Talebiniz yayınlandı.");
                loadActiveRequests();
            }
        }

        // 2. Açık Talepleri Listeleme
        async function loadActiveRequests() {
            const container = document.getElementById('requests-list');

            const { data: requests, error } = await supabase
                .from('requests')
                .select('*')
                .eq('status', 'active')
                .order('created_at', { ascending: false });

            if (error || !requests || requests.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400">Şu anda aktif talep bulunmuyor.</div>`;
                return;
            }

            container.innerHTML = "";
            requests.forEach(req => {
                container.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-3">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-900">${req.title}</h3>
                            <span class="text-xs bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-full">${req.category}</span>
                        </div>
                        <p class="text-xs text-slate-500 font-medium">📍 ${req.city} / ${req.district}</p>
                        <p class="text-sm text-slate-600">${req.description}</p>
                        
                        <div class="border-t border-slate-200 pt-3 space-y-2">
                            <input type="number" id="price_${req.id}" placeholder="Teklif Fiyatınız (TL)" class="w-full px-3 py-2 text-sm bg-white rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" id="msg_${req.id}" placeholder="Usta mesajı (opsiyonel)" class="w-full px-3 py-2 text-sm bg-white rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button onclick="sendOffer('${req.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-sm transition">
                                Teklif Gönder (24.99 TL)
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 3. Usta Teklif Verme
        async function sendOffer(requestId) {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                alert("Lütfen usta hesabınızla giriş yapın!");
                return;
            }

            const priceOffer = document.getElementById(`price_${requestId}`).value;
            const message = document.getElementById(`msg_${requestId}`).value;

            if (!priceOffer) {
                alert("Lütfen teklif fiyatı girin.");
                return;
            }

            const onay = confirm("Teklif göndermek için 24.99 TL düşülecektir. Onaylıyor musunuz?");
            if (!onay) return;

            const { error } = await supabase.from('offers').insert([
                { request_id: requestId, master_id: user.id, price_offer: parseFloat(priceOffer), message, is_paid: true }
            ]);

            if (error) {
                alert("Teklif gönderilemedi (Zaten teklif vermiş olabilirsiniz): " + error.message);
            } else {
                alert("Teklifiniz başarıyla iletildi!");
            }
        }

        window.onload = () => {
            checkUser();
            loadActiveRequests();
        };
    </script>
</body>
</html>
