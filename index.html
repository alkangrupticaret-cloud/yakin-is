<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakın-İş | Giriş ve Kayıt Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-repair-image {
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1581578731548-c64695cc6952?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-repair-image min-h-screen flex flex-col justify-between text-slate-800 font-sans">

    <!-- Üst Logo / Başlık -->
    <header class="w-full pt-8 text-center">
        <h1 class="text-3xl font-black text-white tracking-wider">YAKIN-İŞ</h1>
        <p class="text-slate-300 text-sm mt-1 font-medium">Yerel Hizmet & Usta Bulma Platformu</p>
    </header>

    <!-- Yan Yana Giriş Kartları -->
    <main class="max-w-4xl mx-auto w-full px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">

        <!-- SOL KART: KULLANICI / MÜŞTERİ GİRİŞİ -->
        <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl space-y-5 border border-white/20">
            <div class="text-center space-y-1">
                <div class="inline-block bg-blue-100 text-blue-600 p-3 rounded-2xl mb-2 text-2xl">👤</div>
                <h2 class="text-2xl font-bold text-slate-900">Kullanıcı Girişi</h2>
                <p class="text-xs text-slate-500">Hizmet almak ve talep oluşturmak için</p>
            </div>

            <!-- Form Alanı -->
            <div class="space-y-3">
                <div id="client-name-box" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Ad Soyad</label>
                    <input type="text" id="client_name" placeholder="Ahmet Yılmaz" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">E-posta Adresi</label>
                    <input type="email" id="client_email" placeholder="ornek@mail.com" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Şifre</label>
                    <input type="password" id="client_password" placeholder="••••••••" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button onclick="handleAuth('client')" id="btn-client-submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-500/30">
                    Kullanıcı Girişi Yap
                </button>
            </div>

            <div class="text-center pt-2">
                <span id="client-toggle-text" onclick="toggleMode('client')" class="text-xs text-blue-600 font-bold cursor-pointer hover:underline">
                    Hesabın yok mu? Müşteri olarak kayıt ol
                </span>
            </div>
        </div>

        <!-- SAĞ KART: USTA GİRİŞİ -->
        <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl space-y-5 border border-white/20">
            <div class="text-center space-y-1">
                <div class="inline-block bg-emerald-100 text-emerald-600 p-3 rounded-2xl mb-2 text-2xl">🛠️</div>
                <h2 class="text-2xl font-bold text-slate-900">Usta Girişi</h2>
                <p class="text-xs text-slate-500">Teklif vermek ve iş almak için</p>
            </div>

            <!-- Form Alanı -->
            <div class="space-y-3">
                <div id="master-name-box" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Ad Soyad / Firma Adı</label>
                    <input type="text" id="master_name" placeholder="Usta Mehmet" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div id="master-category-box" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Uzmanlık Alanı</label>
                    <select id="master_category" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="Tesisat">Su Tesisatı</option>
                        <option value="Elektrik">Elektrik</option>
                        <option value="Otomotiv">Oto Tamir / Servis</option>
                        <option value="Boya / Tadilat">Boya / Dekorasyon</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">E-posta Adresi</label>
                    <input type="email" id="master_email" placeholder="usta@mail.com" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Şifre</label>
                    <input type="password" id="master_password" placeholder="••••••••" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <button onclick="handleAuth('master')" id="btn-master-submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/30">
                    Usta Girişi Yap
                </button>
            </div>

            <div class="text-center pt-2">
                <span id="master-toggle-text" onclick="toggleMode('master')" class="text-xs text-emerald-600 font-bold cursor-pointer hover:underline">
                    Usta hesabın yok mu? Hemen Usta Ol
                </span>
            </div>
        </div>

    </main>

    <!-- Alt Bilgi -->
    <footer class="w-full pb-6 text-center text-xs text-slate-400">
        © 2026 Yakın-İş (yakinis.com) — Tüm Hakları Saklıdır.
    </footer>

    <script>
        // Supabase Bağlantı Bilgileriniz
        const SUPABASE_URL = 'https://nvhczlshbifcxfkofmhd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52aGN6bHNoYmlmY3hma29mbWhkIiwicm9sZSI6ImFub24iLCJpWFAtSWQiOjIsImlhdCI6MTc1MDAwMDAwMCwiZXhwIjoyMDY1NTc2MDAwfQ.ornek_anon_key_guvenli_baglanti';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let clientRegisterMode = false;
        let masterRegisterMode = false;

        function toggleMode(role) {
            if (role === 'client') {
                clientRegisterMode = !clientRegisterMode;
                document.getElementById('client-name-box').classList.toggle('hidden', !clientRegisterMode);
                document.getElementById('btn-client-submit').innerText = clientRegisterMode ? "Müşteri Olarak Kayıt Ol" : "Kullanıcı Girişi Yap";
                document.getElementById('client-toggle-text').innerText = clientRegisterMode ? "Zaten hesabın var mı? Giriş yap" : "Hesabın yok mu? Müşteri olarak kayıt ol";
            } else {
                masterRegisterMode = !masterRegisterMode;
                document.getElementById('master-name-box').classList.toggle('hidden', !masterRegisterMode);
                document.getElementById('master-category-box').classList.toggle('hidden', !masterRegisterMode);
                document.getElementById('btn-master-submit').innerText = masterRegisterMode ? "Usta Olarak Kayıt Ol" : "Usta Girişi Yap";
                document.getElementById('master-toggle-text').innerText = masterRegisterMode ? "Zaten hesabın var mı? Giriş yap" : "Usta hesabın yok mu? Hemen Usta Ol";
            }
        }

        async function handleAuth(role) {
            const isRegister = role === 'client' ? clientRegisterMode : masterRegisterMode;
            const email = document.getElementById(`${role}_email`).value;
            const password = document.getElementById(`${role}_password`).value;

            if (!email || !password) {
                alert("Lütfen e-posta ve şifrenizi girin.");
                return;
            }

            if (isRegister) {
                const fullName = document.getElementById(`${role}_name`).value;
                if (!fullName) { alert("Lütfen adınızı girin."); return; }

                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) { alert("Kayıt Hatası: " + error.message); return; }

                if (data.user) {
                    await supabase.from('profiles').insert([
                        { id: data.user.id, full_name: fullName, user_type: role }
                    ]);

                    if (role === 'master') {
                        const category = document.getElementById('master_category').value;
                        await supabase.from('master_details').insert([
                            { user_id: data.user.id, category: category, is_verified: false }
                        ]);
                    }

                    alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
                    toggleMode(role);
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Giriş Hatası: " + error.message);
                } else {
                    alert(`Tebrikler, ${role === 'client' ? 'Kullanıcı' : 'Usta'} olarak başarıyla giriş yapıldı!`);
                }
            }
        }
    </script>
</body>
</html>
