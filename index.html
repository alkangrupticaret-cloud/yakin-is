<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakın-İş | Mahallenizin Ustası Parmaklarınızın Ucunda</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --border-color: #dee2e6;
            --success-color: #198754;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --primary-color: #3d8bfd;
            --primary-hover: #6ea8fe;
            --border-color: #2c2c2c;
            --success-color: #20c997;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button, select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        button.btn-primary {
            background: var(--primary-color);
            color: #fff;
            border: none;
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .job-item {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .job-item:last-child {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            background: #e9ecef;
            color: #495057;
            margin-bottom: 5px;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .whatsapp-btn:hover { background: #1ebe5d; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ÜST MENÜ & KONTROLLER -->
        <header>
            <h1 data-i18n="appTitle">Yakın-İş</h1>
            <div class="controls">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="tr">TR</option>
                    <option value="en">EN</option>
                </select>
                <button onclick="toggleTheme()" id="themeBtn">🌙 Tema</button>
            </div>
        </header>

        <!-- KULLANICI / GİRİŞ DURUMU -->
        <div class="card">
            <h2 data-i18n="authTitle">Oturum & Kimlik</h2>
            <div id="authStatus">Giriş yapılıyor veya kimlik bilgisi bekleniyor...</div>
        </div>

        <!-- İŞ İLANI OLUŞTURMA (Müşteri Paneli) -->
        <div class="card">
            <h2 data-i18n="postJobTitle">Yeni İlan / Hizmet Talebi Oluştur</h2>
            <input type="text" id="jobTitle" placeholder="İş Başlığı (Örn: Musluk Tamiri)">
            <input type="text" id="jobCategory" placeholder="Kategori (Örn: Tesisat)">
            <textarea id="jobDesc" placeholder="İşin detaylarını açıklayın..."></textarea>
            <input type="text" id="jobCity" placeholder="Şehir (Örn: Bursa)">
            <input type="text" id="jobDistrict" placeholder="İlçe (Örn: Nilüfer)">
            <button class="btn-primary" onclick="createJob()" data-i18n="postBtn">İlanı Yayınla</button>
        </div>

        <!-- CANLI İLANLAR VE MESAFE / LİSTELEME -->
        <div class="card">
            <h2 data-i18n="jobsListTitle">Mahallenizdeki Aktif İlanlar</h2>
            <button onclick="loadJobs()" style="margin-bottom: 10px;" data-i18n="refreshBtn">İlanları Yenile</button>
            <div id="jobListContainer">İlanlar yükleniyor...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SUPABASE BAĞLANTI AYARLARI
        // ==========================================
        const SUPABASE_URL = 'sb_publishable__-ViqEL-C2dQ-Wu7r4gOaw_N0IWpaUt';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5id3ZtaHdwdnNteWFpandkZ2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3OTc0MjQsImV4cCI6MjEwNjM3MzQyNH0.DpwGLlF9MM4_F184bKlqvrGsU8MNSg-VPwKBmzL3xbc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // 2. ÇOKLU DİL (i18n) SÖZLÜĞÜ
        // ==========================================
        const translations = {
            tr: {
                appTitle: "Yakın-İş",
                authTitle: "Oturum & Kimlik",
                postJobTitle: "Yeni İlan / Hizmet Talebi Oluştur",
                postBtn: "İlanı Yayınla",
                jobsListTitle: "Mahallenizdeki Aktif İlanlar",
                refreshBtn: "İlanları Yenile",
                successJob: "İlan başarıyla oluşturuldu!",
                errorJob: "İlan oluşturulurken hata:",
                distanceInfo: "Mesafe:"
            },
            en: {
                appTitle: "Yakın-İş",
                authTitle: "Session & Auth",
                postJobTitle: "Post a New Job / Service Request",
                postBtn: "Publish Job",
                jobsListTitle: "Active Jobs in Your Area",
                refreshBtn: "Refresh Jobs",
                successJob: "Job successfully created!",
                errorJob: "Error creating job:",
                distanceInfo: "Distance:"
            }
        };

        let currentLang = 'tr';

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        // ==========================================
        // 3. DARK / LIGHT TEMA YÖNETİMİ
        // ==========================================
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeBtn').textContent = isDark ? '☀️ Tema' : '🌙 Tema';
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').textContent = '☀️ Tema';
            }
            checkUserSession();
            loadJobs();
            getUserLocationAndCalculate();
        });

        // ==========================================
        // 4. OTURUM KONTROLÜ
        // ==========================================
        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const statusDiv = document.getElementById('authStatus');
            if (session) {
                statusDiv.innerHTML = `Giriş yapıldı: <b>${session.user.email}</b>`;
            } else {
                statusDiv.innerHTML = `Misafir Modu (Test oturumu aktif)`;
            }
        }

        // ==========================================
        // 5. KONUM BAZLI HESAPLAMA (Haversine Formülü)
        // ==========================================
        let userCoords = { lat: 40.1885, lng: 29.0610 }; // Varsayılan Bursa

        function getUserLocationAndCalculate() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userCoords.lat = position.coords.latitude;
                    userCoords.lng = position.coords.longitude;
                });
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 'Bilinmiyor';
            const R = 6371; // km
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1) + ' km';
        }

        // ==========================================
        // 6. WHATSAPP İLETİŞİM ENTEGRASYONU
        // ==========================================
        function openWhatsAppChat(phone, jobTitle) {
            const cleanPhone = phone ? phone.replace(/[^0-9]/g, '') : '905000000000';
            const message = `Merhaba, Yakın-İş üzerindeki "${jobTitle}" ilanınız için ulaştım.`;
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // ==========================================
        // 7. İŞ İLANI OLUŞTURMA VE LİSTELEME
        // ==========================================
        async function createJob() {
            const title = document.getElementById('jobTitle').value;
            const category = document.getElementById('jobCategory').value;
            const description = document.getElementById('jobDesc').value;
            const city = document.getElementById('jobCity').value;
            const district = document.getElementById('jobDistrict').value;

            if (!title || !category) {
                alert('Lütfen başlık ve kategori alanlarını doldurun.');
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            const customerId = session ? session.user.id : null;

            if (!customerId) {
                alert('İlan vermek için lütfen giriş yapın veya test kullanıcısı tanımlayın.');
                return;
            }

            const { error } = await supabaseClient.from('jobs').insert([{
                customer_id: customerId,
                title,
                category,
                description,
                city,
                district,
                latitude: userCoords.lat,
                longitude: userCoords.lng,
                status: 'active'
            }]);

            if (error) {
                alert(translations[currentLang].errorJob + ' ' + error.message);
            } else {
                alert(translations[currentLang].successJob);
                loadJobs();
            }
        }

        async function loadJobs() {
            const container = document.getElementById('jobListContainer');
            container.innerHTML = 'Yükleniyor...';

            const { data, error } = await supabaseClient
                .from('jobs')
                .select('*, profiles(full_name, phone, latitude, longitude)')
                .eq('status', 'active')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<span style="color:red;">İlanlar yüklenirken hata oluştu: ${error.message}</span>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = 'Henüz aktif bir ilan bulunmuyor.';
                return;
            }

            container.innerHTML = '';
            data.forEach(job => {
                const dist = calculateDistance(userCoords.lat, userCoords.lng, job.latitude, job.longitude);
                const phone = job.profiles ? job.profiles.phone : '905555555555';
                
                const item = document.createElement('div');
                item.className = 'job-item';
                item.innerHTML = `
                    <span class="badge">${job.category}</span>
                    <h3>${job.title}</h3>
                    <p>${job.description}</p>
                    <small>📍 ${job.city} / ${job.district} | Mesafe: <b>${dist}</b></small><br>
                    <button class="whatsapp-btn" onclick="openWhatsAppChat('${phone}', '${job.title}')">
                        💬 WhatsApp ile İletişim
                    </button>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
