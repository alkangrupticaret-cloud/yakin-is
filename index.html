<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Yakınİş — İhtiyacın, yakında.</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#111827}header{background:#111827;color:#fff;padding:22px 18px 28px}.wrap{max-width:720px;margin:auto}header h1{margin:0 0 6px;font-size:27px}header p{margin:0;color:#cbd5e1}.search{margin:-18px 16px 18px;background:#fff;border-radius:14px;padding:10px;box-shadow:0 6px 20px #0001;display:flex;gap:8px}.search input{flex:1;border:0;outline:0;font-size:16px;padding:8px}.search button,.submit{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:10px 14px;font-weight:700}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}.cat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px 8px;text-align:center;font-weight:600;cursor:pointer}.cat span{display:block;font-size:25px;margin-bottom:5px}.section{padding:20px 16px 8px;display:flex;justify-content:space-between}.section h2{font-size:19px;margin:0}.cards{padding:0 16px;display:grid;gap:12px}.card{background:#fff;border-radius:15px;padding:16px;border:1px solid #e5e7eb}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:750;font-size:17px}.meta{color:#64748b;font-size:14px;margin-top:4px}.tag{background:#eff6ff;color:#1d4ed8;padding:5px 8px;border-radius:8px;font-size:12px;height:max-content}.actions{display:flex;gap:8px;margin-top:13px}.actions a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:10px;font-weight:650}.wa{background:#dcfce7;color:#166534}.call{background:#e0e7ff;color:#3730a3}.empty{padding:30px 16px;text-align:center;color:#64748b}.admin{margin:25px 16px;background:#111827;color:#fff;border-radius:16px;padding:16px}.admin button{margin-top:10px;width:100%;padding:11px;border:0;border-radius:10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.box{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:20px}.box input,.box select,.box textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #d1d5db;border-radius:10px}.box button{width:100%;padding:12px;margin-top:8px}.close{background:#e5e7eb;border:0;border-radius:10px}.note{font-size:12px;color:#64748b;margin-top:10px}</style></head><body><header><div class="wrap"><h1>📍 Yakınİş</h1><p>Yakınındaki hizmeti kolayca bul.</p></div></header><main class="wrap"><div class="search"><input id="q" placeholder="Hizmet ara... örn. tesisatçı"><button onclick="render()">Ara</button></div><div class="cats" id="cats"></div><div class="section"><h2>Hizmet verenler</h2><span id="count"></span></div><div class="cards" id="cards"></div><div class="admin"><b>İşletmeni eklemek ister misin?</b><div style="opacity:.8;margin-top:5px">Ücretsiz ilan gönder; yayınlanmadan önce kontrol edilir.</div><button onclick="openModal()">+ İşletme Ekle</button></div><div style="margin:18px 16px 30px;text-align:center"><button onclick="openAdmin()" style="background:none;border:0;color:#64748b;text-decoration:underline;padding:10px">Yönetici</button></div></main><div class="modal" id="adminModal">
<div class="box"><h2>Yakınİş Yönetim</h2><div id="loginBox"><input id="ae" type="email" placeholder="Yönetici e-posta"><input id="ap" type="password" placeholder="Şifre"><button class="submit" onclick="adminLogin()">Giriş yap</button><button class="close" onclick="closeAdmin()">Kapat</button><div id="amsg" class="note"></div></div><div id="panel" style="display:none"><button class="close" onclick="adminLogout()">Çıkış</button><div id="adminList" style="margin-top:12px"></div></div></div></div><div class="modal" id="modal"><div class="box"><h2>İşletmeni ekle</h2><input id="n" placeholder="İşletme adı"><select id="c"><option>Tesisatçı</option><option>Elektrikçi</option><option>Temizlik</option><option>Oto Yıkama</option><option>Nakliye</option><option>Özel Ders</option><option>Diğer</option></select><input id="d" placeholder="İlçe / mahalle"><input id="p" placeholder="Telefon (05xx...)" inputmode="tel"><textarea id="desc" placeholder="Kısaca hizmetlerini anlat"></textarea><button class="submit" onclick="addBusiness()">İlan Gönder</button><button class="close" onclick="closeModal()">Vazgeç</button><div class="note">İlan önce beklemeye alınır; yönetici onayından sonra yayınlanır.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>// Supabase bağlantısı — frontend için yalnızca Publishable key kullanılır.
// Secret / service_role anahtarını buraya ASLA koyma.
window.YAKINIS_CONFIG = {
  SUPABASE_URL: 'https://nbwvmhwpvsmyaijwdgag.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable__-ViqEL-C2dQ-Wu7r4gOaw_N0IWpaUt'
};
</script><script>const cats=[['🔧','Tesisatçı'],['⚡','Elektrikçi'],['🧹','Temizlik'],['🚗','Oto Yıkama'],['🚚','Nakliye'],['📚','Özel Ders']];const cfg=window.YAKINIS_CONFIG||{};const configured=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_URL.includes('YOUR-');const sb=configured?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;let data=[];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderCats(){catsEl.innerHTML=cats.map(x=>`<div class="cat" onclick="filterCat('${x[1]}')"><span>${x[0]}</span>${x[1]}</div>`).join('')}async function load(){if(!sb){cards.innerHTML='<div class="empty">Uygulama kurulum dosyasındaki Supabase ayarları henüz girilmemiş.</div>';count.textContent='';return}const r=await sb.from('businesses').select('*').eq('status','approved').order('created_at',{ascending:false});if(r.error){cards.innerHTML='<div class="empty">Veriler yüklenemedi. Yönetici Supabase ayarlarını kontrol etmeli.</div>';return}data=r.data||[];render()}function render(cat=''){const q=document.getElementById('q').value.toLowerCase();let a=data.filter(x=>(!cat||x.category===cat)&&(!q||(`${x.name} ${x.category} ${x.district} ${x.description}`).toLowerCase().includes(q)));count.textContent=a.length+' ilan';cards.innerHTML=a.length?a.map(x=>`<div class="card"><div class="top"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.category)} · ${esc(x.district)}</div></div><div class="tag">Onaylı</div></div><div class="actions"><a class="wa" href="https://wa.me/9${x.phone.replace(/\D/g,'')}" target="_blank">WhatsApp</a><a class="call" href="tel:${esc(x.phone)}">Ara</a></div></div>`).join(''):'<div class="empty">Bu aramada ilan bulunamadı.</div>'}function filterCat(c){q.value=c;render(c)}function openModal(){modal.style.display='flex'}function closeModal(){modal.style.display='none'}async function addBusiness(){if(!sb){alert('Önce Supabase kurulumu yapılmalı.');return}const row={name:n.value.trim(),category:c.value,district:d.value.trim(),phone:p.value.trim(),description:desc.value.trim(),status:'pending'};if(!row.name||!row.district||!row.phone){alert('İşletme adı, ilçe ve telefon zorunlu.');return}const r=await sb.from('businesses').insert(row);if(r.error){alert(r.error.message);return}closeModal();n.value=d.value=p.value=desc.value='';alert('İlanın alındı. Yönetici onayından sonra yayınlanacak.')}const catsEl=document.getElementById('cats'),cards=document.getElementById('cards'),count=document.getElementById('count');renderCats();load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function openAdmin(){document.getElementById('adminModal').style.display='flex';const s=await sb.auth.getSession();if(s.data.session){showAdminPanel();}}
function closeAdmin(){document.getElementById('adminModal').style.display='none'}
async function adminLogin(){if(!sb){return}const r=await sb.auth.signInWithPassword({email:document.getElementById('ae').value,password:document.getElementById('ap').value});if(r.error){document.getElementById('amsg').textContent=r.error.message;return}showAdminPanel()}
function showAdminPanel(){document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';loadAdmin()}
async function loadAdmin(){const box=document.getElementById('adminList');const r=await sb.from('businesses').select('*').order('created_at',{ascending:false});if(r.error){box.innerHTML='<div class="note">'+esc(r.error.message)+'</div>';return}box.innerHTML=(r.data||[]).map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="meta">${esc(x.category)} · ${esc(x.district)} · ${esc(x.phone)} · ${esc(x.status)}</div><div class="actions">${x.status!=='approved'?`<button class="submit" onclick="setStatus('${x.id}','approved')">Onayla</button>`:''}${x.status!=='rejected'?`<button onclick="setStatus('${x.id}','rejected')">Reddet</button>`:''}<button onclick="removeListing('${x.id}')">Sil</button></div></div>`).join('')||'<div class="empty">İlan yok.</div>'}
async function setStatus(id,status){const r=await sb.from('businesses').update({status}).eq('id',id);if(r.error)alert(r.error.message);else loadAdmin()}
async function removeListing(id){if(!confirm('İlan silinsin mi?'))return;const r=await sb.from('businesses').delete().eq('id',id);if(r.error)alert(r.error.message);else loadAdmin()}
async function adminLogout(){await sb.auth.signOut();document.getElementById('panel').style.display='none';document.getElementById('loginBox').style.display='block'}
</script></body></html>
